name: drift-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify LICENSE is MIT
        run: |
          grep -q "MIT License" LICENSE || { echo "DRIFT: LICENSE is not MIT"; exit 1; }

      - name: Verify Tier 2 CLAUDE.md exists
        run: |
          test -f CLAUDE.md || { echo "DRIFT: CLAUDE.md missing"; exit 1; }

      - name: Verify spec.md exists
        run: |
          test -f spec.md || { echo "DRIFT: spec.md missing"; exit 1; }

      - name: Verify Memory Bank has 5 Cline-pattern files
        run: |
          expected=(logbook activeContext decisionLog productContext systemPatterns)
          for f in "${expected[@]}"; do
            test -f "memory_bank/${f}.md" || { echo "DRIFT: memory_bank/${f}.md missing"; exit 1; }
          done

      - name: Verify drift-check workflow self-reference
        run: |
          test -f .github/workflows/drift-check.yml || { echo "DRIFT: self workflow missing"; exit 1; }

      - name: Verify README declares current phase
        run: |
          grep -qE "^\*\*Phase [0-9]+" README.md || { echo "DRIFT: README missing Phase declaration"; exit 1; }

      - name: Verify .gitignore covers secrets and model cache
        run: |
          grep -q "^\.env$" .gitignore || { echo "DRIFT: .gitignore does not exclude .env"; exit 1; }
          grep -q "huggingface" .gitignore || { echo "DRIFT: .gitignore missing huggingface cache"; exit 1; }
          grep -q "safetensors" .gitignore || { echo "DRIFT: .gitignore missing safetensors"; exit 1; }

      - name: Verify repo name canon (longctx-bench-honest)
        run: |
          grep -q "longctx-bench-honest" README.md || { echo "DRIFT: README missing repo name canon"; exit 1; }
          grep -q "longctx-bench-honest" CLAUDE.md || { echo "DRIFT: CLAUDE.md missing repo name canon"; exit 1; }
          grep -q "longctx-bench-honest" spec.md || { echo "DRIFT: spec.md missing repo name canon"; exit 1; }

      - name: Verify benchmark scope (RULER + LongBench v2 + NIAH)
        run: |
          grep -q "RULER" README.md || { echo "DRIFT: README missing RULER"; exit 1; }
          grep -q "LongBench" README.md || { echo "DRIFT: README missing LongBench"; exit 1; }
          grep -q "NIAH" README.md || { echo "DRIFT: README missing NIAH"; exit 1; }

      - name: Verify model scope (Qwen2.5-7B-1M + GitHub Models)
        run: |
          grep -q "Qwen2.5-7B" README.md || { echo "DRIFT: README missing Qwen2.5-7B model"; exit 1; }
          grep -q "GitHub Models" README.md || { echo "DRIFT: README missing GitHub Models"; exit 1; }
          grep -q "GPT-5" README.md || { echo "DRIFT: README missing GPT-5"; exit 1; }
          grep -q "Claude Sonnet" README.md || { echo "DRIFT: README missing Claude Sonnet"; exit 1; }
          grep -q "Llama 3.3" README.md || { echo "DRIFT: README missing Llama 3.3"; exit 1; }

      - name: Verify cost-tier transparency table structure
        run: |
          grep -q "Cost-tier transparency" README.md || { echo "DRIFT: README missing cost-tier section"; exit 1; }
          grep -q "Credit card required" README.md || { echo "DRIFT: README missing Credit card required row"; exit 1; }

      - name: Verify Honest results section exists
        run: |
          grep -q "Honest results" README.md || { echo "DRIFT: README missing Honest results section"; exit 1; }

      - name: Verify Selected under thesis section (constraint-optimized framing)
        run: |
          grep -q "## Selected under" README.md || { echo "DRIFT: README missing Selected under section"; exit 1; }
          grep -q "Zero credit card" README.md || { echo "DRIFT: README missing zero credit card constraint"; exit 1; }
          grep -q "Consumer laptop only" README.md || { echo "DRIFT: README missing consumer laptop constraint"; exit 1; }
          grep -q "Public source / OSS only" README.md || { echo "DRIFT: README missing public source constraint"; exit 1; }
          grep -q "Drift-CI enforced" README.md || { echo "DRIFT: README missing drift-CI constraint"; exit 1; }
          grep -q "constraint-optimized AI engineering" README.md || { echo "DRIFT: README missing portfolio category line"; exit 1; }

      - name: Verify Why this is the literal best section (option-space audit evidence)
        run: |
          grep -q "Why this is the literal best" README.md || { echo "DRIFT: README missing Why best section"; exit 1; }
          grep -q "Rejected alternatives" README.md || { echo "DRIFT: README missing rejected alternatives table column"; exit 1; }

      - name: Verify pyproject.toml exists with project metadata
        run: |
          test -f pyproject.toml || { echo "DRIFT: pyproject.toml missing"; exit 1; }
          grep -q "name = \"longctx-bench-honest\"" pyproject.toml || { echo "DRIFT: pyproject.toml name mismatch"; exit 1; }
          grep -q "requires-python" pyproject.toml || { echo "DRIFT: pyproject.toml missing requires-python"; exit 1; }

      - name: Verify Dependabot config (pip ecosystem)
        run: |
          test -f .github/dependabot.yml || { echo "DRIFT: dependabot.yml missing"; exit 1; }
          grep -q "package-ecosystem: \"pip\"" .github/dependabot.yml || { echo "DRIFT: dependabot.yml missing pip ecosystem"; exit 1; }

      - name: "Verify D-drive cache redirect documented (consumer laptop disk constraint)"
        run: |
          grep -q "Disk layout" README.md || { echo "DRIFT: README missing Disk layout section"; exit 1; }
          grep -q "HF_HOME" pyproject.toml || grep -q "HF_HOME" README.md || { echo "DRIFT: HF_HOME redirect not documented"; exit 1; }

      - name: Verify pip-audit declared in dev-dependencies
        run: |
          grep -q "pip-audit" pyproject.toml || { echo "DRIFT: pyproject.toml missing pip-audit (supply chain defense)"; exit 1; }

      - name: Verify NIAH baseline runner exists (Phase 1 deliverable)
        run: |
          test -f examples/baseline_niah.py || { echo "DRIFT: examples/baseline_niah.py missing"; exit 1; }
          grep -q "Qwen/Qwen2.5-7B-Instruct-1M" examples/baseline_niah.py || { echo "DRIFT: baseline_niah.py model ref drifted"; exit 1; }
          grep -q "bitsandbytes" examples/baseline_niah.py || { echo "DRIFT: baseline_niah.py int4 quant ref drifted"; exit 1; }

      - name: Verify Phase 1 baseline JSON evidence cells (cost-tier table claim backing)
        run: |
          for ctx in 4000 5000 6000 8000; do
            test -f "artifacts/baseline_${ctx}.json" || { echo "DRIFT: artifacts/baseline_${ctx}.json missing (README cost-tier cell unverifiable)"; exit 1; }
          done
          # 4k cell must be PASS (README claims it as the ceiling success cell)
          grep -q '"status": "PASS"' artifacts/baseline_4000.json || { echo "DRIFT: baseline_4000.json status != PASS"; exit 1; }
          grep -q '"needle_found": true' artifacts/baseline_4000.json || { echo "DRIFT: baseline_4000.json needle_found != true"; exit 1; }
          # 5k/6k/8k must be OOM (README claims OOM ceiling above 4k)
          for ctx in 5000 6000 8000; do
            grep -q '"status": "OOM"' "artifacts/baseline_${ctx}.json" || { echo "DRIFT: baseline_${ctx}.json status != OOM (claimed in README)"; exit 1; }
          done

      - name: Verify README cost-tier table cites JSON evidence by URL
        run: |
          grep -q "artifacts/baseline_4000.json" README.md || { echo "DRIFT: README missing baseline_4000.json link"; exit 1; }
          grep -q "artifacts/baseline_5000.json" README.md || { echo "DRIFT: README missing baseline_5000.json link"; exit 1; }
          grep -q "artifacts/baseline_8000.json" README.md || { echo "DRIFT: README missing baseline_8000.json link"; exit 1; }

      - name: Verify ADR-007 documents VRAM ceiling characterization
        run: |
          grep -q "ADR-007" memory_bank/decisionLog.md || { echo "DRIFT: decisionLog missing ADR-007"; exit 1; }
          grep -q "6GB VRAM" memory_bank/decisionLog.md || { echo "DRIFT: ADR-007 missing 6GB VRAM ceiling characterization"; exit 1; }

      - name: Verify Phase 2a cloud NIAH runner exists
        run: |
          test -f examples/cloud_niah.py || { echo "DRIFT: examples/cloud_niah.py missing (Phase 2a deliverable)"; exit 1; }
          grep -q "models.github.ai/inference" examples/cloud_niah.py || { echo "DRIFT: cloud_niah.py missing GitHub Models endpoint"; exit 1; }

      - name: Verify Phase 2a cloud JSON evidence cells
        run: |
          # 2 PASS cells, 2 TOKEN_LIMIT cells, 1 UNAVAILABLE_MODEL cell, 1 DeepSeek 2k PASS cell
          test -f artifacts/cloud_openai-gpt-4-1-mini_4000.json || { echo "DRIFT: gpt-4.1-mini 4k evidence missing"; exit 1; }
          test -f artifacts/cloud_meta-llama-3-3-70b-instruct_4000.json || { echo "DRIFT: llama-3.3-70b 4k evidence missing"; exit 1; }
          test -f artifacts/cloud_openai-gpt-5_4000.json || { echo "DRIFT: gpt-5 4k evidence missing"; exit 1; }
          test -f artifacts/cloud_openai-gpt-5_2000.json || { echo "DRIFT: gpt-5 2k evidence missing"; exit 1; }
          test -f artifacts/cloud_deepseek-deepseek-v3-0324_4000.json || { echo "DRIFT: deepseek-v3 4k evidence missing"; exit 1; }
          test -f artifacts/cloud_deepseek-deepseek-v3-0324_2000.json || { echo "DRIFT: deepseek-v3 2k evidence missing"; exit 1; }
          # Status field literal verification (matches README cost-tier claims)
          grep -q '"status": "PASS"' artifacts/cloud_openai-gpt-4-1-mini_4000.json || { echo "DRIFT: gpt-4.1-mini 4k != PASS"; exit 1; }
          grep -q '"status": "PASS"' artifacts/cloud_meta-llama-3-3-70b-instruct_4000.json || { echo "DRIFT: llama-3.3-70b 4k != PASS"; exit 1; }
          grep -q '"status": "PASS"' artifacts/cloud_deepseek-deepseek-v3-0324_2000.json || { echo "DRIFT: deepseek-v3 2k != PASS"; exit 1; }
          grep -q '"status": "TOKEN_LIMIT"' artifacts/cloud_openai-gpt-5_4000.json || { echo "DRIFT: gpt-5 4k != TOKEN_LIMIT"; exit 1; }
          grep -q '"status": "TOKEN_LIMIT"' artifacts/cloud_deepseek-deepseek-v3-0324_4000.json || { echo "DRIFT: deepseek-v3 4k != TOKEN_LIMIT"; exit 1; }

      - name: Verify Cloud free-tier honest map section + ADR-008
        run: |
          grep -q "Cloud free-tier honest map" README.md || { echo "DRIFT: README missing Cloud free-tier honest map section"; exit 1; }
          grep -q "ADR-008" memory_bank/decisionLog.md || { echo "DRIFT: decisionLog missing ADR-008"; exit 1; }
          grep -q "Anthropic" memory_bank/decisionLog.md || { echo "DRIFT: ADR-008 missing Anthropic-absent finding"; exit 1; }
          grep -q "unavailable_model" memory_bank/decisionLog.md || { echo "DRIFT: ADR-008 missing gpt-5 unavailable finding"; exit 1; }

      - name: Verify Phase 2b WSL2 vllm negative result evidence + ADR-009
        run: |
          test -f examples/wsl_vllm_niah.py || { echo "DRIFT: examples/wsl_vllm_niah.py missing"; exit 1; }
          test -f artifacts/wsl_vllm_4000.json || { echo "DRIFT: wsl_vllm_4000.json evidence missing"; exit 1; }
          grep -q '"status": "OOM"' artifacts/wsl_vllm_4000.json || { echo "DRIFT: wsl_vllm_4000.json status != OOM (ADR-009 claim)"; exit 1; }
          grep -q "ADR-009" memory_bank/decisionLog.md || { echo "DRIFT: decisionLog missing ADR-009"; exit 1; }
          grep -q "shared-memory" memory_bank/decisionLog.md || { echo "DRIFT: ADR-009 missing Windows shared-memory finding"; exit 1; }
          grep -q "wsl_vllm_4000.json" README.md || { echo "DRIFT: README missing wsl_vllm_4000.json link"; exit 1; }

      - name: Summary
        run: echo "All drift checks passed."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test toolchain
        run: |
          python -m pip install --upgrade pip
          pip install pytest pip-audit

      - name: Run pytest
        run: pytest tests/ -v

      - name: Run pip-audit (test environment)
        run: pip-audit --strict
